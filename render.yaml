services:
  - type: web
    name: cv-studio
    env: node
    plan: free
    buildCommand: npm --prefix Frontend install --include=dev && npm --prefix Frontend run build && npm --prefix Backend install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_GENAI_API_KEY
        sync: false
